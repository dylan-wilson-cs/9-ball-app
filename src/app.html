<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <link rel="icon" href="%sveltekit.assets%/favicon.png" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="light dark" />
        <script>
            // Bootstrap themes by data-bs-theme, not by the system setting,
            // so mirror the system setting onto it and follow changes
            (() => {
                const dark = matchMedia("(prefers-color-scheme: dark)");
                const apply = () => {
                    document.documentElement.dataset.bsTheme = dark.matches
                        ? "dark"
                        : "light";
                };
                apply();
                dark.addEventListener("change", apply);
            })();
        </script>
        %sveltekit.head%
    </head>
    <body>
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
